syntax = "proto3";
package gossip;
option go_package = "github.com/peacewalker122/hapartition/internal/gossip/pb";

// Entry is a single versioned key-value pair.
message Entry {
  string key   = 1;
  string value = 2;
  int64  version = 3;
  string origin = 4;
  bool deleted = 5;

}
// EntryBatch is used for both broadcast messages and anti-entropy snapshots.
message EntryBatch {
  repeated Entry entries = 1;
}

// NodeMeta carries per-node metadata encoded in memberlist's Meta field.
message NodeMeta {
  string redis_addr = 1; // e.g. "10.0.0.1:6379"
}

// GossipMessage is the top-level wire envelope. The payload is one of:
//   - entry_batch: best-effort broadcast or anti-entropy snapshot
//   - replicate_req: reliable point-to-point write request
//   - replicate_resp: ACK for a replicate_req
message GossipMessage {
  oneof payload {
    EntryBatch entry_batch = 1;
    ReplicateRequest replicate_req = 2;
    ReplicateResponse replicate_resp = 3;
  }
}

// ReplicateRequest instructs a replica to apply a set of entries and ACK back.
message ReplicateRequest {
  string request_id = 1;   // correlation ID for the ACK
  string sender_id = 2;    // who to send the ACK back to
  repeated Entry entries = 3;
}

// ReplicateResponse is the ACK for a ReplicateRequest.
message ReplicateResponse {
  string request_id = 1;
  string node_id = 2;
  bool success = 3;
}
